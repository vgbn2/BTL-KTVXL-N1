name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test-and-build:
    name: Offline host checks and ARM firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake python3 gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Script syntax sanity checks
        run: |
          bash -n scripts/*.sh scripts/linux/*.sh
          python3 -m py_compile scripts/*.py scripts/linux/*.py scripts/windows/*.py tests/repro/*.py

      - name: Host tests, boundary checks, and UART self-test
        run: bash scripts/agent_test.sh

      - name: Build ARM firmware with bundled STM32 support
        run: make BUILD_DIR="$RUNNER_TEMP/firmware-build" firmware

      - name: Package firmware and verify checksums
        working-directory: ${{ runner.temp }}/firmware-build/firmware
        run: |
          mkdir -p "$RUNNER_TEMP/firmware-artifact"
          cp firmware.elf firmware.bin firmware.hex firmware.map "$RUNNER_TEMP/firmware-artifact/"
          cd "$RUNNER_TEMP/firmware-artifact"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > REVISION.txt
          arm-none-eabi-gcc --version > TOOLCHAIN.txt
          sha256sum firmware.elf firmware.bin firmware.hex firmware.map REVISION.txt TOOLCHAIN.txt > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stm32f103-firmware-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firmware-artifact/
          if-no-files-found: error
          retention-days: 14
